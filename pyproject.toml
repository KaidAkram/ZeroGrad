[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "zerograd-sec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "scikit-learn", "matplotlib", "pydantic", "pillow"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
